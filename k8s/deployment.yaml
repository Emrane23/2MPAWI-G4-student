apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
  namespace: dev
  labels:
    app: student-management
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
      - name: student-app
        image: emrane/student-management:latest  # On utilisera une image qui existe
        imagePullPolicy: Always
        ports:
        - containerPort: 8080  # ✅ DOIT ÊTRE 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-db.dev.svc.cluster.local:3306/student_management?useSSL=false&allowPublicKeyRetrieval=true"
        - name: SPRING_DATASOURCE_USERNAME
          value: "app_user"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "app_password"
        - name: SPRING_JPA_HIBERNATE_DDL_AUTO
          value: "update"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-management
  namespace: dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-management
  template:
    metadata:
      labels:
        app: student-management
    spec:
      containers:
      - name: student-app
        image: emrane/student-management:latest
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql-db.dev.svc.cluster.local:3306/studentdb"
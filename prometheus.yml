global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Application
  - job_name: 'spring-boot-app'
    metrics_path: '/student/actuator/prometheus'
    static_configs:
      - targets: ['student-app-g4-terraform:8089']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'student-management-app'